# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - src/azure-sa/infra


resources:
  repositories:
  - repository: self

variables:
- name: dockerRegistryServiceConnection
  value: 'b695fff1-df6e-498b-bc69-6efbe5b01da9'
- name: imageRepository
  value: 'lachlandowfilevault'
- name: containerRegistry
  value: 'filevaultsaacrdv0m7x.azurecr.io'
- name: dockerfilePath
  value: '$(Build.SourcesDirectory)/src/azure-sa/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'
- name: vmImageName
  value: 'ubuntu-latest'
  
pool:
  name: Default
stages:
- stage: Test
  displayName: Run linting and tests
  jobs:
  - job: Test
    displayName: Test
    pool:
      name: Default
    steps:
    - task: SonarQubePrepare@5
      displayName: 'Run sonarqube prepare'
      inputs:
        SonarQube: 'YourSonarQubeServiceConnection'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'YourProjectKey'
        cliProjectName: 'YourProjectName'
        cliSources: 'src/azure-sa'
    - script: npm install
      workingDirectory: src/azure-sa
      displayName: 'Install dependencies'
    - script: npm run lint
      workingDirectory: src/azure-sa
      displayName: 'Run linting'
    - script: npm run test
      workingDirectory: src/azure-sa
      displayName: 'Run jest tests'
    - task: SonarQubeAnalyze@5
      displayName: 'Run sonarqube analyze'
    - task: SonarQubePublish@5
      displayName: 'Run sonarqube publish'
      inputs:
        pollingTimeoutSec: '300'

