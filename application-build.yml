# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker
trigger: none

resources:
  pipelines:
  - pipeline: application-ci
    source: 'Run linting, test and sonarqube'
    trigger: true

variables:
- template: pipeline-variables.yml

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: Default
    steps:
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        docker build \
          --tag $(containerRegistry)/$(imageRepository):$(tag) \
          --tag $(containerRegistry)/$(imageRepository):latest \
          -f $(dockerfilePath) \
          $(Build.SourcesDirectory)/src/azure-sa
        
        docker push $(containerRegistry)/$(imageRepository):$(tag)
        docker push $(containerRegistry)/$(imageRepository):latest
      displayName: Build and Push (standard)

- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy Manifests
    pool:
      name: Default
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'filevault-azure-connection' 
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroupName) --name $(aksClusterName) --overwrite-existing
          
          # Fetch Storage Account Name (we know the pattern or can query it)
          # We'll assume the RG has only one SA for this app, or construct it matching terraform logic: filevaultsa...
          # Actually, let's query it by tag to be safe, or just list in RG
          STORAGE_ACCOUNT_NAME=$(az storage account list -g $(resourceGroupName) --query "[0].name" -o tsv)
          
          # Fetch Access Key
          ACCESS_KEY=$(az storage account keys list -g $(resourceGroupName) -n $STORAGE_ACCOUNT_NAME --query "[0].value" -o tsv)
          
          # Create/Update Secret
          kubectl create secret generic filevault-secrets \
            --from-literal=AZURE_STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME \
            --from-literal=AZURE_STORAGE_ACCOUNT_KEY=$ACCESS_KEY \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl apply -f src/azure-sa/k8s/
      displayName: 'Apply Kubernetes Manifests and Secrets'
